<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Office Layout</title>
<style>
html{
  font-family: "游ゴシック体", YuGothic, "YuGothic M", sans-serif;
}
button, input, select, textarea {
  font-family : inherit;
  font-size : 100%;
}
</style>
</head>
<body>
  <div id=app>
    <h1>オフィス座席表</h1>
    <p>最初にサンプルの座席表が表示されます。下の入力欄で名前や配置を編集すると、座席表にすぐ反映されます。</p>
    <office-layout :boxes=boxes></office-layout>
    <div>
<pre>
書式
xの開始位置, yの開始位置, x方向の長さ, y方向の長さ, 名前, 文字の回転角度（省略可）
</pre>
    </div>
    <div><label for="layout-input">座席データ</label></div>
    <div><textarea id="layout-input" rows=20 cols=60 v-model=inputText></textarea></div>
    <div role="alert" v-if="layout.errors.length">
      <p>入力にエラーがあります。正しい行のみ表示しています。</p>
      <ul><li v-for="error in layout.errors">{{ error }}</li></ul>
    </div>
    <button type="button" id="reset-sample" @click=resetSample>サンプルに戻す</button>
    <button type="button" @click=downloadSvg :disabled="exporting">{{ exporting ? '保存中…' : 'PNGで保存' }}</button>
    <p role="alert" v-if="exportError">{{ exportError }}</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.44/dist/vue.global.prod.js" integrity="sha384-tORx0bXmMnTC28EYQe1coaGZKSQupXQEYDBNex8xkzJ9iqUoNy9Y+VFBhVxi4kUr" crossorigin="anonymous"></script>
  <script src=components/office-layout.js></script>
  <script src=textarea-data.js></script>
  <script src=index.js></script>
</body>
</html>
